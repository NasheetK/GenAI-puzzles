{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Player Rating Table</title>

  <!-- Shared Montessori theme -->
  <link rel="stylesheet" href="{% static 'css/playful_montessori.css' %}">
  <link rel="stylesheet" href="{% static 'css/home_menu_montessori.css' %}">

  <!-- Minimal local styles only for the emoji radios and table grid -->
  <style>
    :root { --size: 28px; }
    .rating-table-wrapper { max-width: 980px; margin: 0 auto; }
    .rating-table { width: 100%; border-collapse: collapse; }
    .rating-table th, .rating-table td {
      border: 1px solid #e5e7eb; padding: 8px; text-align: center; vertical-align: middle;
    }
    .rating-table th { background: #f7f7f7; }
    .name-cell { text-align: left; padding-left: 12px; font-weight: 700; }

    .rating { display: inline-flex; gap: 6px; align-items: center; }
    .rating input { display: none; }

    .emoji-label {
      display: inline-grid; place-items: center;
      width: var(--size); height: var(--size);
      font-size: 18px; line-height: 1;
      border-radius: 8px; user-select: none; cursor: pointer;
      background: #fff; border: 1px solid #e5e7eb;
      /* touch-friendly: no hover/transition */
    }
    input:checked + .emoji-label {
      background: #ffd966; border-color: #eab308;
      box-shadow: 0 0 0 3px rgba(250,204,21,0.3);
    }
    .emoji-label span { font-size: 20px; }
    @media (max-width:520px){ :root{ --size:24px } .emoji-label span{ font-size:18px } }

    .action-forms { display: grid; gap: 10px; max-width: 340px; margin: 16px auto 0; }
  </style>
</head>
<body class="montessori-bg">
   <main class="center-screen">
  <div class="montessori-card stack-buttons">
    <h1 class="montessori-heading" style="text-align:center;">Rate Yourself</h1>

    <div class="rating-table-wrapper">
      <table id="rating-table" class="rating-table" aria-describedby="table-desc">
        <thead>
          <tr id="header-row"></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="action-forms">
      <form id="ai_rating" method="POST" action="{% url 'ai_rating' %}">
        {% csrf_token %}
        <button type="submit" class="montessori-btn montessori-btn-purple" style="display:none;">View AI Rating</button>
      </form>

      <form id="view_history" method="POST" action="{% url 'view_history' %}">
        {% csrf_token %}
        <button type="submit" class="montessori-btn montessori-btn-blue">View History</button>
      </form>

      <form id="change_mode" method="POST" action="{% url 'change_mode' %}">
        {% csrf_token %}
        <button type="submit" class="montessori-btn montessori-btn-yellow">Change Mode</button>
      </form>

      <form id="new_puzzle" method="POST" action="{% url 'new_puzzle' %}">
        {% csrf_token %}
        <button type="submit" class="montessori-btn montessori-btn-green">Next Puzzle Task</button>
      </form>

      <form action="{% url 'clear_and_exit' %}" onsubmit="return confirm('Confirm to exit?');">
        <button type="submit" class="montessori-btn montessori-btn-red">Exit</button>
      </form>
    </div>
  </div>
  </main>

  <script>
    const players = {{ players|safe }};
    const tasks = ['Satisfy with what you did?','How you feel about the tasks?'];
    const emojis = ['😡','😕','😐','🙂','😄'];
    const emojiAlt = ['very unhappy','unhappy','neutral','happy','very happy'];

    const header_row = document.getElementById('header-row');
    const tbody = document.getElementById('tbody');

    function buildHeader(){
      header_row.innerHTML = '';
      const thName = document.createElement('th');
      thName.textContent = 'name';
      header_row.appendChild(thName);
      for(const t of tasks){
        const th = document.createElement('th');
        th.textContent = t;
        header_row.appendChild(th);
      }
    }

    function buildRows(){
      tbody.innerHTML = '';
      players.forEach((p, rowIdx)=>{
        const tr = document.createElement('tr');

        const tdName = document.createElement('td');
        tdName.className = 'name-cell';
        tdName.textContent = p;
        tr.appendChild(tdName);

        tasks.forEach((task, taskIdx)=>{
          const td = document.createElement('td');
          const groupName = `r_${rowIdx}_${taskIdx}`;
          const wrapper = document.createElement('div');
          wrapper.className = 'rating';

          emojis.forEach((emo, i)=>{
            const input = document.createElement('input');
            input.type = 'radio';
            input.name = groupName;
            input.id = `${groupName}_v${i}`;
            input.value = String(i+1);

            const label = document.createElement('label');
            label.htmlFor = input.id;
            label.className = 'emoji-label';
            label.setAttribute('aria-label', emojiAlt[i]);

            const span = document.createElement('span');
            span.textContent = emo;
            label.appendChild(span);

            wrapper.appendChild(input);
            wrapper.appendChild(label);
          });

          td.appendChild(wrapper);
          tr.appendChild(td);
        });

        tbody.appendChild(tr);
      });
    }

    function gatherRatings(){
      const results = [];
      players.forEach((p, rowIdx)=>{
        const rowRes = { name: p, ratings: [] };
        tasks.forEach((t, taskIdx)=>{
          const group = `r_${rowIdx}_${taskIdx}`;
          const checked = document.querySelector(`input[name="${group}"]:checked`);
          rowRes.ratings.push(checked ? Number(checked.value) : null);
        });
        results.push(rowRes);
      });
      return results;
    }

    function allSelected(){
      return !gatherRatings().some(r => r.ratings.includes(null));
    }

    // Submit, then navigate to AI Rating
    document.getElementById('ai_rating').addEventListener('submit', function(e) {
      e.preventDefault();
      if (!allSelected()) { alert('Please finish the rating!'); return; }
      const data = gatherRatings();
      fetch("{% url 'submit_ratings' %}", {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
      }).then(res => {
        if (!res.ok) { alert('Error occurs while submitting ratings!'); return; }
        window.location.href = "{% url 'ai_rating' %}";
      }).catch(() => alert('Error occurs while submitting ratings!'));
    });

    // Submit, then navigate to History
    document.getElementById('view_history').addEventListener('submit', function(e) {
      e.preventDefault();
      if (!allSelected()) { alert('Please finish the rating!'); return; }
      const data = gatherRatings();
      fetch("{% url 'submit_ratings' %}", {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
      }).then(res => {
        if (!res.ok) { alert('Error occurs while submitting ratings!'); return; }
        window.location.href = "{% url 'view_history' %}";
      }).catch(() => alert('Error occurs while submitting ratings!'));
    });

    // Submit, then ask to change mode
    document.getElementById('change_mode').addEventListener('submit', function(e) {
      e.preventDefault();
      if (!allSelected()) { alert('Please finish the rating!'); return; }
      const data = gatherRatings();
      fetch("{% url 'submit_ratings' %}", {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
      }).then(res => {
        if (!res.ok) { alert('Error occurs while submitting ratings!'); return; }
        const current_mode = '{{ mode|escapejs }}';
        let new_mode;
        if (current_mode === 'collaborative') new_mode = 'competitive';
        else if (current_mode === 'competitive') new_mode = 'collaborative';
        else { alert('Unknown mode: ' + current_mode); return; }
        if (confirm("Confirm to change the mode to " + new_mode + "?")) {
          window.location.href = "{% url 'change_mode' %}";
        }
      }).catch(() => alert('Error occurs while submitting ratings!'));
    });

    // Submit, then start next puzzle
    document.getElementById('new_puzzle').addEventListener('submit', function(e) {
      e.preventDefault();
      if (!allSelected()) { alert('Please finish the rating!'); return; }
      const data = gatherRatings();
      fetch("{% url 'submit_ratings' %}", {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
      }).then(res => {
        if (!res.ok) { alert('Error occurs while submitting ratings!'); return; }
        if (confirm("Ready to start a new puzzle task?")) {
          window.location.href = "{% url 'new_puzzle' %}";
        }
      }).catch(() => alert('Error occurs while submitting ratings!'));
    });

    buildHeader();
    buildRows();
  </script>
</body>
</html>
