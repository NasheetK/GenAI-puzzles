{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Form Your Team</title>

  <!-- Shared Montessori styles -->
  <link rel="stylesheet" href="{% static 'css/playful_montessori.css' %}">
  <link rel="stylesheet" href="{% static 'css/home_menu_montessori.css' %}">

  <!-- Fonts (okay to keep if your CSS doesn't already import them) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    .mute-toggle {
        position: fixed;
        top: 20px;
        right: 20px;       /* top-right corner */
        font-size: 22px;
        background: #ffffff;
        border: 2px solid #ccc;
        border-radius: 50%;
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        z-index: 9999;    /* always on top */
    }

    .mute-toggle:hover {
        background: #f2f2f2;
    }
  </style>
</head>
<body class="montessori-bg">
 <main class="center-screen">
  <div class="montessori-card stack-buttons">
    <h1 class="montessori-heading">Name</h1>

    <form id="team_form" method="POST" action="{% url 'form_team_collaborative_multi' %}">
      {% csrf_token %}

      <div id="player_container">
        {% for i in "x"|center:count %}
        <div class="player_row">
          <label class="montessori-label">Player {{ forloop.counter }}:</label>
          <input type="text" class="montessori-input" name="member_{{ forloop.counter }}" placeholder="Type your name here">
          {% if count > 3 %}
            <!-- fixed: remove_row -> removeRow -->
            <button type="button" class="montessori-btn montessori-btn-red remove_btn" onclick="removeRow(this)">🗑️</button>
          {% endif %}
        </div>
        {% endfor %}
      </div>

      <div class="button-group">
        {% if add_flag %}
          <button type="button" id="add_btn" class="montessori-btn montessori-btn-blue">➕ Add Player</button>
        {% endif %}
        <button type="submit" class="montessori-btn montessori-btn-green">Submit</button>
      </div>
    </form>

    <form action="{% url 'clear_and_exit' %}" onsubmit="return confirm('Confirm to exit?');">
      <button type="submit" class="montessori-btn montessori-btn-red">Exit</button>
    </form>
  </div>
   <button id="mute-btn" class="mute-toggle">🔊</button>
    <audio id="bg-audio"
         src="{% static 'audio/'|add:audio_others %}"
         preload="auto" style="display:none" loop></audio>
  </main>

  <script>
    const ROBOT_ENABLE = {{ robot_enable|yesno:"true,false" }};
    console.log("Robot enabled?", ROBOT_ENABLE);
    if (ROBOT_ENABLE === false) {
      window.addEventListener("DOMContentLoaded", () => {
        try {
          const message = "Please enter the names of players.";
          const utterance = new SpeechSynthesisUtterance(message);
          utterance.lang = "en-US";
          utterance.rate = 0.9;
          utterance.pitch = 1;
          speechSynthesis.speak(utterance);
        } catch (_) {
        }
      });
      window.addEventListener("beforeunload", () => {
        speechSynthesis.cancel();
      });
    }

    const audio = document.getElementById("bg-audio");
    // Key used to store time for audio_others
    const TIME_KEY = "audio_others_time";
    const MUTE_KEY = "audio_muted";
    // --- Restore position when showing page ---
    function resumeAudio() {
      const savedTime = localStorage.getItem(TIME_KEY);
      const savedMute = localStorage.getItem(MUTE_KEY);
      if (savedTime) audio.currentTime = parseFloat(savedTime);
      if (savedMute != null) {
        audio.muted = savedMute === "true";
      }
      audio.play().catch(() => {});
      updateIcon();
    }
    window.addEventListener("pageshow", resumeAudio);

    // --- Save position before leaving page ---
    window.addEventListener("beforeunload", () => {
      localStorage.setItem(TIME_KEY, audio.currentTime.toString());
    });

    const muteBtn = document.getElementById("mute-btn");

    // Initialize icon based on current mute state
    function updateIcon() {
        muteBtn.textContent = audio.muted ? "🔇" : "🔊";
    }

    muteBtn.addEventListener("click", () => {
        audio.muted = !audio.muted;
        localStorage.setItem(MUTE_KEY, audio.muted.toString());
        updateIcon();
    });

    // update icon again when audio loads
    audio.addEventListener("loadeddata", updateIcon);

    const container = document.getElementById("player_container");
    const add_btn = document.getElementById("add_btn");

    let count = {{ count }};
    const add_flag = {{ add_flag|yesno:"true,false" }};
    const max_count = 6; // maximum 6 players

    if (add_flag && add_btn) {
      add_btn.addEventListener("click", function() {
        if (count >= max_count) {
          alert(`Maximum ${max_count} players allowed.`);
          return;
        }

        count++;
        const row = document.createElement("div");
        row.classList.add("player_row");
        row.innerHTML = `
          <label class="montessori-label">Player ${count}:</label>
          <input type="text" class="montessori-input" name="member_${count}" placeholder="Type your name here">
          <button type="button" class="montessori-btn montessori-btn-red remove_btn" onclick="removeRow(this)">🗑️</button>
        `;
        container.appendChild(row);
        renumberPlayers();
      });
    }

    function removeRow(btn) {
      btn.parentElement.remove();
      renumberPlayers();
    }

    function renumberPlayers() {
      const rows = container.querySelectorAll(".player_row");
      rows.forEach((row, index) => {
        const label = row.querySelector("label");
        const input = row.querySelector("input");
        if (label) label.textContent = `Player ${index + 1}:`;
        if (input) input.name = `member_${index + 1}`;
      });
      count = rows.length;
    }

    const teamForm = document.getElementById("team_form");

    teamForm.addEventListener("submit", function(e) {
      const inputs = container.querySelectorAll("input.montessori-input");
      const names = [];
      let hasEmpty = false;
      let hasDuplicate = false;

      inputs.forEach(input => {
        const val = input.value.trim();
        if (val === "") hasEmpty = true;
        if (names.includes(val)) hasDuplicate = true;
        names.push(val);
      });

      if (hasEmpty) {
        alert("Please fill in all player names.");
        e.preventDefault();
        return false;
      }

      if (hasDuplicate) {
        alert("Player names must be unique.");
        e.preventDefault();
        return false;
      }
    });
  </script>
</body>
</html>
