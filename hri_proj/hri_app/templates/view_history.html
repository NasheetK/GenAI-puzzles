{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View History</title>

  <!-- Shared Montessori styles -->
  <link rel="stylesheet" href="{% static 'css/playful_montessori.css' %}">
  <link rel="stylesheet" href="{% static 'css/home_menu_montessori.css' %}">

  <!-- Minimal local styles for the table & visibility -->
  <style>
    .history-wrap { max-width: 1100px; margin: 0 auto; }
    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #e5e7eb; padding: 8px; text-align: center; }
    th { background: #f7f7f7; }
    .hidden { display: none; }
    .controls { display: grid; gap: 10px; max-width: 360px; margin: 16px auto 0; }
    label { font-weight: 700; margin-right: 8px; }
    select { padding: 10px 12px; border-radius: 12px; border: 1px solid #e5e7eb; }
  </style>
</head>
<body class="montessori-bg">
   <main class="center-screen">
  <div class="montessori-card stack-buttons history-wrap">
    <h1 class="montessori-heading" style="text-align:center;">Player History</h1>

    <!-- Player selector -->
    <div class="controls" style="max-width: 520px;">
      <div style="display:flex; gap:10px; align-items:center; justify-content:center;">
        <label for="player_select">Select Player:</label>
        <select id="player_select" class="montessori-input" style="flex:1;">
          <option value="">-- Choose a player --</option>
          {% for player in players %}
            <option value="{{ player }}">{{ player }}</option>
          {% endfor %}
        </select>
      </div>
      <button type="button" class="montessori-btn montessori-btn-blue" onclick="window.history.back();">Back</button>
    </div>

    <!-- History table -->
    <div class="table-wrap">
      <table id="record_table" class="hidden">
        <thead>
          <tr>
            <th>Record ID</th>
            <th>Team Member</th>
            <th>Game Mode</th>
            <th>Difficulty</th>
            <th>With AI</th>
            <th>Puzzle Amount</th>
            <th>Start Time</th>
            <th>End Time</th>
            <th>Puzzle Solved Amount</th>
            <th>Correct Piece Amount</th>
            <th>Wrong Piece Amount</th>
            <th>Accuracy</th>
          </tr>
        </thead>
        <tbody></tbody>

      </table>
    </div>
  </div>
</main>

  <script>

    window.addEventListener("DOMContentLoaded", () => {
      try {
        const message = "Please select the name to view the history records.";
        const utterance = new SpeechSynthesisUtterance(message);
        utterance.lang = "en-US";
        utterance.rate = 0.9;
        utterance.pitch = 1;
        speechSynthesis.speak(utterance);
      } catch(_) {}
    });
    window.addEventListener("beforeunload", () => {
      speechSynthesis.cancel();
    });

    const player_records = JSON.parse('{{ player_records|escapejs }}');
    const player_select = document.getElementById('player_select');
    const record_table = document.getElementById('record_table');
    const tbody = record_table.querySelector('tbody');

    player_select.addEventListener('change', function() {
      const selected_player = this.value;
      tbody.innerHTML = '';

      const records = player_records[selected_player];
      if (!records) {
        record_table.classList.add('hidden');
        return;
      }

      for (const r of records) {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${r.record_id}</td>
          <td>${r.team_member}</td>
          <td>${r.game_mode}</td>
          <td>${r.difficulty}</td>
          <td>${r.with_ai}</td>
          <td>${r.puzzle_amount}</td>
          <td>${r.time_start}</td>
          <td>${r.time_end}</td>
          <td>${r.solved_puzzle_amount}</td>
          <td>${r.correct_piece_amount}</td>
          <td>${r.wrong_piece_amount}</td>
          <td>${r.accuracy}</td>

        `;
        tbody.appendChild(row);
      }
      record_table.classList.remove('hidden');
    });
  </script>
</body>
</html>
