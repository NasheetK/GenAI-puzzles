{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View History</title>

  <!-- Shared Montessori styles -->
  <link rel="stylesheet" href="{% static 'css/playful_montessori.css' %}">
  <link rel="stylesheet" href="{% static 'css/home_menu_montessori.css' %}">

  <!-- Minimal local styles for the table & visibility -->
  <style>
    .history-wrap { max-width: 1100px; margin: 0 auto; }
    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #e5e7eb; padding: 8px; text-align: center; }
    th { background: #f7f7f7; }
    .hidden { display: none; }
    .controls { display: grid; gap: 10px; max-width: 360px; margin: 16px auto 0; }
    label { font-weight: 700; margin-right: 8px; }
    select { padding: 10px 12px; border-radius: 12px; border: 1px solid #e5e7eb; }
    .mute-toggle {
        position: fixed;
        top: 20px;
        right: 20px;       /* top-right corner */
        font-size: 22px;
        background: #ffffff;
        border: 2px solid #ccc;
        border-radius: 50%;
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        z-index: 9999;    /* always on top */
    }

    .mute-toggle:hover {
        background: #f2f2f2;
    }
  </style>
</head>
<body class="montessori-bg">
   <main class="center-screen">
  <div class="montessori-card stack-buttons history-wrap">
    <h1 class="montessori-heading" style="text-align:center;">Player History</h1>

    <!-- Player selector -->
    <div class="controls" style="max-width: 520px;">
      <div style="display:flex; gap:10px; align-items:center; justify-content:center;">
        <label for="player_select">Select Player:</label>
        <select id="player_select" class="montessori-input" style="flex:1;">
          <option value="">-- Choose a player --</option>
          {% for player in players %}
            <option value="{{ player }}">{{ player }}</option>
          {% endfor %}
        </select>
      </div>
      <button type="button" class="montessori-btn montessori-btn-blue" onclick="window.history.back();">Back</button>
    </div>

    <!-- History table -->
    <div class="table-wrap">
      <table id="record_table" class="hidden">
        <thead>
          <tr>
            <th>Record ID</th>
            <th>Team Member</th>
            <th>Game Mode</th>
            <th>Difficulty</th>
            <th>With AI</th>
            <th>Number of Puzzles</th>
            <th>Start Time</th>
            <th>End Time</th>
            <th>Number of Solved Puzzles</th>
            <th>Number of Correct Attempts</th>
            <th>Number of Incorrect Attempts</th>
            <th>Accuracy</th>
          </tr>
        </thead>
        <tbody></tbody>

      </table>
    </div>
  </div>
     <button id="mute-btn" class="mute-toggle">🔊</button>
    <audio id="bg-audio"
         src="{% static 'audio/'|add:audio_others %}"
         preload="auto" style="display:none" loop></audio>
</main>

  <script>
    const ROBOT_ENABLE = {{ robot_enable|yesno:"true,false" }};
    console.log("Robot enabled?", ROBOT_ENABLE);
    if (ROBOT_ENABLE === false) {
      window.addEventListener("DOMContentLoaded", () => {
        try {
          const message = "Please select the name to view the history records.";
          const utterance = new SpeechSynthesisUtterance(message);
          utterance.lang = "en-US";
          utterance.rate = 0.9;
          utterance.pitch = 1;
          speechSynthesis.speak(utterance);
        } catch(_) {}
      });

      window.addEventListener("beforeunload", () => {
        speechSynthesis.cancel();
      });
    }

    const audio = document.getElementById("bg-audio");
    // Key used to store time for audio_others
    const TIME_KEY = "audio_others_time";
    const MUTE_KEY = "audio_muted";
    // --- Restore position when showing page ---
    function resumeAudio() {
      const savedTime = localStorage.getItem(TIME_KEY);
      const savedMute = localStorage.getItem(MUTE_KEY);
      if (savedTime) audio.currentTime = parseFloat(savedTime);
      if (savedMute != null) {
        audio.muted = savedMute === "true";
      }
      audio.play().catch(() => {});
      updateIcon();
    }
    window.addEventListener("pageshow", resumeAudio);

    // --- Save position before leaving page ---
    window.addEventListener("beforeunload", () => {
      localStorage.setItem(TIME_KEY, audio.currentTime.toString());
    });

    const muteBtn = document.getElementById("mute-btn");

    // Initialize icon based on current mute state
    function updateIcon() {
        muteBtn.textContent = audio.muted ? "🔇" : "🔊";
    }

    function toggleMute() {
        audio.muted = !audio.muted;
        localStorage.setItem(MUTE_KEY, audio.muted.toString());
        updateIcon();
    }

    // Allow BOTH click and touch
    muteBtn.addEventListener("click", toggleMute);
    muteBtn.addEventListener("touchstart", (e) => {
        e.preventDefault();   // avoid double-trigger on mobile
        toggleMute();
    });

    // update icon again when audio loads
    audio.addEventListener("loadeddata", updateIcon);

    const player_records = JSON.parse('{{ player_records|escapejs }}');
    const player_select = document.getElementById('player_select');
    const record_table = document.getElementById('record_table');
    const tbody = record_table.querySelector('tbody');

    player_select.addEventListener('change', function() {
      const selected_player = this.value;
      tbody.innerHTML = '';

      const records = player_records[selected_player];
      if (!records) {
        record_table.classList.add('hidden');
        return;
      }

      for (const r of records) {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${r.record_id}</td>
          <td>${r.team_member}</td>
          <td>${r.game_mode}</td>
          <td>${r.difficulty}</td>
          <td>${r.with_ai}</td>
          <td>${r.puzzle_amount}</td>
          <td>${r.time_start}</td>
          <td>${r.time_end}</td>
          <td>${r.solved_puzzle_amount}</td>
          <td>${r.correct_piece_amount}</td>
          <td>${r.wrong_piece_amount}</td>
          <td>${r.accuracy}</td>

        `;
        tbody.appendChild(row);
      }
      record_table.classList.remove('hidden');
    });
  </script>
</body>
</html>
