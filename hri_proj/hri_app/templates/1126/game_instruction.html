{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Start Puzzle</title>

  <!-- Shared Montessori styles -->
  <link rel="stylesheet" href="{% static 'css/playful_montessori.css' %}">
  <link rel="stylesheet" href="{% static 'css/home_menu_montessori.css' %}">

  <!-- Fonts (optional if already in your CSS) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    .mute-toggle {
        position: fixed;
        top: 20px;
        right: 20px;       /* top-right corner */
        font-size: 22px;
        background: #ffffff;
        border: 2px solid #ccc;
        border-radius: 50%;
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        z-index: 9999;    /* always on top */
    }

    .mute-toggle:hover {
        background: #f2f2f2;
    }
  </style>
</head>

<body class="montessori-bg">
   <main class="center-screen">
  <div class="montessori-card stack-buttons">
    {% if message %}
      <p class="montessori-heading" style="text-align:center;">{{ message }}</p>
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <button type="submit" class="montessori-btn montessori-btn-green">Start Puzzle</button>
    </form>

    <form id="view_tutorial" onsubmit="openTutorial(event)">
      {% csrf_token %}
      <button type="submit" class="montessori-btn montessori-btn-orange">View Tutorial</button>
    </form>

    <form action="{% url 'clear_and_exit' %}" onsubmit="return confirm('Confirm to exit?');">
      <button type="submit" class="montessori-btn montessori-btn-red">Exit</button>
    </form>
  </div>
     <button id="mute-btn" class="mute-toggle">🔊</button>
    <audio id="bg-audio"
         src="{% static 'audio/'|add:audio_others %}"
         preload="auto" style="display:none"  loop></audio>
</main>

  <script>
    const ROBOT_ENABLE = {{ robot_enable|yesno:"true,false" }};
    console.log("Robot enabled?", ROBOT_ENABLE);
    if (ROBOT_ENABLE === false) {
      window.addEventListener("DOMContentLoaded", () => {
          const message = "{{ message|escapejs }}";
          if (message) {
            try {
              const utterance = new SpeechSynthesisUtterance(message);
              utterance.lang = "en-US";
              utterance.rate = 0.9;
              utterance.pitch = 1;
              speechSynthesis.speak(utterance);
            } catch(_) {}
          }
        });
      window.addEventListener("beforeunload", () => {
        speechSynthesis.cancel();
      });
    }

    const audio = document.getElementById("bg-audio");
    // Key used to store time for audio_others
    const TIME_KEY = "audio_others_time";
    const MUTE_KEY = "audio_muted";
    // --- Restore position when showing page ---
    function resumeAudio() {
      const savedTime = localStorage.getItem(TIME_KEY);
      const savedMute = localStorage.getItem(MUTE_KEY);
      if (savedTime) audio.currentTime = parseFloat(savedTime);
      if (savedMute != null) {
        audio.muted = savedMute === "true";
      }
      audio.play().catch(() => {});
      updateIcon();
    }
    window.addEventListener("pageshow", resumeAudio);

    // --- Save position before leaving page ---
    window.addEventListener("beforeunload", () => {
      localStorage.setItem(TIME_KEY, audio.currentTime.toString());
    });

    const muteBtn = document.getElementById("mute-btn");

    // Initialize icon based on current mute state
    function updateIcon() {
        muteBtn.textContent = audio.muted ? "🔇" : "🔊";
    }

    function toggleMute() {
        audio.muted = !audio.muted;
        localStorage.setItem(MUTE_KEY, audio.muted.toString());
        updateIcon();
    }

    // Allow BOTH click and touch
    muteBtn.addEventListener("click", toggleMute);
    muteBtn.addEventListener("touchstart", (e) => {
        e.preventDefault();   // avoid double-trigger on mobile
        toggleMute();
    });

    // update icon again when audio loads
    audio.addEventListener("loadeddata", updateIcon);

    function openTutorial(e) {
        e.preventDefault();  // Stop form from navigating away
        const videoUrl = "{% url 'view_tutorial' %}";

        // Open small popup window
        window.open(
            videoUrl,
            "tutorialWindow",
            "width=720,height=480,toolbar=0,menubar=0,scrollbars=0,resizable=1"
        );
    }
  </script>
</body>
</html>
