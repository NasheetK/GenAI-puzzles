{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Player Rating Table</title>

  <!-- Shared Montessori theme -->
  <link rel="stylesheet" href="{% static 'css/playful_montessori.css' %}">
  <link rel="stylesheet" href="{% static 'css/home_menu_montessori.css' %}">

  <!-- Minimal local styles only for the emoji radios and table grid -->
  <style>
    :root { --size: 28px; }
    .rating-table-wrapper { max-width: 980px; margin: 0 auto; }
    .rating-table { width: 100%; border-collapse: collapse; }
    .rating-table th, .rating-table td {
      border: 1px solid #e5e7eb; padding: 8px; text-align: center; vertical-align: middle;
    }
    .rating-table th { background: #f7f7f7; }
    .name-cell { text-align: left; padding-left: 12px; font-weight: 700; }

    .rating { display: inline-flex; gap: 6px; align-items: center; }
    .rating input { display: none; }

    .emoji-label {
      display: inline-grid; place-items: center;
      width: var(--size); height: var(--size);
      font-size: 18px; line-height: 1;
      border-radius: 8px; user-select: none; cursor: pointer;
      background: #fff; border: 1px solid #e5e7eb;
      /* touch-friendly: no hover/transition */
    }
    input:checked + .emoji-label {
      background: #ffd966; border-color: #eab308;
      box-shadow: 0 0 0 3px rgba(250,204,21,0.3);
    }
    .emoji-label span { font-size: 20px; }
    @media (max-width:520px){ :root{ --size:24px } .emoji-label span{ font-size:18px } }

    .action-forms { display: grid; gap: 10px; max-width: 340px; margin: 16px auto 0; }
    .mute-toggle {
        position: fixed;
        top: 20px;
        right: 20px;       /* top-right corner */
        font-size: 22px;
        background: #ffffff;
        border: 2px solid #ccc;
        border-radius: 50%;
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        z-index: 9999;    /* always on top */
    }

    .mute-toggle:hover {
        background: #f2f2f2;
    }
  </style>
</head>
<body class="montessori-bg">
   <main class="center-screen">
  <div class="montessori-card stack-buttons">
    <h1 class="montessori-heading" style="text-align:center;">Task Summary</h1>

    <div class="table-wrap">
      <table id="record_table" class="hidden">
        <thead>
          <tr>
            <th>Name</th>
            <th>Game Mode</th>
            <th>Puzzle Total Amount</th>
            <th>Puzzle Solved Amount</th>
            <th>Correct Piece Amount</th>
            <th>Wrong Piece Amount</th>
            <th>Accuracy</th>
            <th>Time Spent</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>


    <div class="action-forms">

      <form id="view_history" method="POST" action="{% url 'view_history' %}">
        {% csrf_token %}
        <button type="submit" class="montessori-btn montessori-btn-blue">View History</button>
      </form>

      <form id="change_mode" method="POST" action="{% url 'change_mode' %}">
        {% csrf_token %}
        <button type="submit" class="montessori-btn montessori-btn-yellow">Change Mode</button>
      </form>

      <form id="new_puzzle" method="POST" action="{% url 'new_puzzle' %}">
        {% csrf_token %}
        <button type="submit" class="montessori-btn montessori-btn-green">Next Puzzle Task</button>
      </form>

      <form action="{% url 'clear_and_exit' %}" onsubmit="return confirm('Confirm to exit?');">
        <button type="submit" class="montessori-btn montessori-btn-red">Exit</button>
      </form>
    </div>
  </div>
     <button id="mute-btn" class="mute-toggle">🔊</button>
    <audio id="bg-audio"
         src="{% static 'audio/'|add:audio_others %}"
         preload="auto" style="display:none" loop></audio>
  </main>

  <script>
    const ROBOT_ENABLE = {{ robot_enable|yesno:"true,false" }};
    console.log("Robot enabled?", ROBOT_ENABLE);
    if (ROBOT_ENABLE === false) {
      window.addEventListener("DOMContentLoaded", () => {
        try {
          const message = "Congratulation! You have completed the puzzle tasks! Great job!";
          const utterance = new SpeechSynthesisUtterance(message);
          utterance.lang = "en-US";
          utterance.rate = 0.9;
          utterance.pitch = 1;
          speechSynthesis.speak(utterance);
        } catch(_) {}
      });

      window.addEventListener("beforeunload", () => {
        speechSynthesis.cancel();
      });
    }

    const audio = document.getElementById("bg-audio");
    // Key used to store time for audio_others
    const KEY = "audio_others_time";
    // --- Restore position when showing page ---
    function resumeAudio() {
      const savedTime = localStorage.getItem(KEY);
      if (savedTime) audio.currentTime = parseFloat(savedTime);
      audio.play().catch(() => {});
      updateIcon();
    }
    window.addEventListener("pageshow", resumeAudio);

    // --- Save position before leaving page ---
    window.addEventListener("beforeunload", () => {
      localStorage.setItem(KEY, audio.currentTime.toString());
    });

    const muteBtn = document.getElementById("mute-btn");

    // Initialize icon based on current mute state
    function updateIcon() {
        muteBtn.textContent = audio.muted ? "🔇" : "🔊";
    }

    muteBtn.addEventListener("click", () => {
        audio.muted = !audio.muted;
        updateIcon();
    });

    // update icon again when audio loads
    audio.addEventListener("loadeddata", updateIcon);

    // Submit, then navigate to History
    document.getElementById('view_history').addEventListener('submit', function(e) {
      e.preventDefault();
      window.location.href = "{% url 'view_history' %}";
    });

    // Submit, then ask to change mode
    document.getElementById('change_mode').addEventListener('submit', function(e) {
      e.preventDefault();
      const current_mode = '{{ mode|escapejs }}';
      let new_mode;
      if (current_mode === 'collaborative') new_mode = 'competitive';
      else if (current_mode === 'competitive') new_mode = 'collaborative';
      else { alert('Unknown mode: ' + current_mode); return; }
      if (confirm("Confirm to change the mode to " + new_mode + "?")) {
        window.location.href = "{% url 'change_mode' %}";
      }
    });

    // Submit, then start next puzzle
    document.getElementById('new_puzzle').addEventListener('submit', function(e) {
      e.preventDefault();
      window.location.href = "{% url 'new_puzzle' %}";
    });

    const record_table = document.getElementById('record_table');
    const tbody = record_table.querySelector('tbody');
    const records = {{ player_records|safe }};
    const mode = "{{ mode }}";
    let nameCell;
    // for (const r of records) {
    //     const row = document.createElement('tr');
    //     row.innerHTML = `
    //       <td>${r.name}</td>
    //       <td>${r.game_mode}</td>
    //       <td>${r.puzzle_amount}</td>
    //       <td>${r.solved_puzzle_amount}</td>
    //       <td>${r.correct_piece_amount}</td>
    //       <td>${r.wrong_piece_amount}</td>
    //       <td>${r.accuracy}</td>
    //       <td>${r.time_gap}</td>
    //     `;
    //     tbody.appendChild(row);
    //   }
    for (let i = 0; i < records.length; i++) {
        const r = records[i];
        const row = document.createElement('tr');

        if (mode === 'competitive') {
          nameCell = i === 0 ? `${r.name} 🏆` : r.name;
        }
        else {
          nameCell = i === 0 ? `${r.name}` : r.name;
        }
        row.innerHTML = `
          <td class="name-cell">${nameCell}</td>
          <td>${r.game_mode}</td>
          <td>${r.puzzle_amount}</td>
          <td>${r.solved_puzzle_amount}</td>
          <td>${r.correct_piece_amount}</td>
          <td>${r.wrong_piece_amount}</td>
          <td>${r.accuracy}</td>
          ${mode === 'competitive' ? `<td>${r.time_gap}</td>` : ''}
        `;
        tbody.appendChild(row);
    }
    if (mode === 'competitive') {
        const ths = record_table.querySelectorAll('thead th');
        ths[ths.length - 1].style.display = '';
    } else {
        const ths = record_table.querySelectorAll('thead th');
        ths[ths.length - 1].style.display = 'none';
    }

  </script>
</body>
</html>
