{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Design Your Own Puzzles</title>

  <!-- Shared Montessori styles -->
  <link rel="stylesheet" href="{% static 'css/playful_montessori.css' %}">
  <link rel="stylesheet" href="{% static 'css/home_menu_montessori.css' %}">

  <!-- (Optional) Fonts if not already imported by your CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    .mute-toggle {
        position: fixed;
        top: 20px;
        right: 20px;       /* top-right corner */
        font-size: 22px;
        background: #ffffff;
        border: 2px solid #ccc;
        border-radius: 50%;
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        z-index: 9999;    /* always on top */
    }

    .mute-toggle:hover {
        background: #f2f2f2;
    }
  </style>
</head>
<body class="montessori-bg">
 <main class="center-screen">
  <div class="montessori-card stack-buttons">
    <h1 class="montessori-heading">Design your own puzzles</h1>

    <form method="POST">
      {% csrf_token %}

      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 20px;">
        <label class="montessori-label" style="min-width: 120px; margin-bottom: 0;">Difficulty:</label>
        <select name="difficulty" class="montessori-input" style="flex: 1;">
          {% for d in difficulties %}
            <option value="{{ d }}">{{ d }}</option>
          {% endfor %}
        </select>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 20px;">
        <label class="montessori-label" style="min-width: 120px; margin-bottom: 0;">Character:</label>
        <select name="character" class="montessori-input" style="flex: 1;">
          {% for c in characters %}
            <option value="{{ c }}">{{ c }}</option>
          {% endfor %}
        </select>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 20px;">
        <label class="montessori-label" style="min-width: 120px; margin-bottom: 0;">Activity:</label>
        <select name="activity" class="montessori-input" style="flex: 1;">
          {% for ac in activities %}
            <option value="{{ ac }}">{{ ac }}</option>
          {% endfor %}
        </select>
      </div>
      {% if mode == 'collaborative' %}
        <div class="ai-checkbox-wrapper">
          <img src="{% static 'icons/Enable AI.png' %}" alt="Enable AI" class="ai-checkbox-icon">
          <input
            type="checkbox"
            id="useAiCheckbox"
            name="with_ai"
            aria-checked="true"
          />
          <label for="useAiCheckbox">
            Involve QT robot
          </label>
        </div><br>
      {% endif %}

      <button type="submit" class="montessori-btn montessori-btn-green button-with-icon">
        <img src="{% static 'icons/Create puzzle.png' %}" alt="Create Puzzle" class="button-icon">
        Create Puzzle
      </button>
    </form>

    <form action="{% url 'clear_and_exit' %}" onsubmit="return confirm('Confirm to exit?');">
      <button type="submit" class="montessori-btn montessori-btn-red button-with-icon">
        <img src="{% static 'icons/Exit.png' %}" alt="Exit" class="button-icon">
        Exit
      </button>
    </form>

    <form id="view_history" method="POST" action="{% url 'view_history' %}">
      {% csrf_token %}
      <button type="submit" class="montessori-btn montessori-btn-blue button-with-icon">
        <img src="{% static 'icons/History.png' %}" alt="History" class="button-icon">
        View History
      </button>
    </form>
  </div>
   <button id="mute-btn" class="mute-toggle">🔊</button>
    <audio id="bg-audio"
         src="{% static 'audio/'|add:audio_others %}"
         preload="auto" style="display:none" loop></audio>
  </main>
</body>
<script>
  const ROBOT_ENABLE = {{ robot_enable|yesno:"true,false" }};
  console.log("Robot enabled?", ROBOT_ENABLE);
  if (ROBOT_ENABLE === false) {
    window.addEventListener("DOMContentLoaded", () => {
      try {
        const message = "Please set your preferences for the puzzles.";
        const utterance = new SpeechSynthesisUtterance(message);
        utterance.lang = "en-US";
        utterance.rate = 0.9;
        utterance.pitch = 1;
        speechSynthesis.speak(utterance);
      } catch(_) {}
    });

    window.addEventListener("beforeunload", () => {
        speechSynthesis.cancel();
    });
  }

  const audio = document.getElementById("bg-audio");
    // Key used to store time for audio_others
    const TIME_KEY = "audio_others_time";
    const MUTE_KEY = "audio_muted";
    // --- Restore position when showing page ---
    function resumeAudio() {
      const savedTime = localStorage.getItem(TIME_KEY);
      const savedMute = localStorage.getItem(MUTE_KEY);
      if (savedTime) audio.currentTime = parseFloat(savedTime);
      if (savedMute != null) {
        audio.muted = savedMute === "true";
      }
      audio.play().catch(() => {});
      updateIcon();
    }
    window.addEventListener("pageshow", resumeAudio);

    // --- Save position before leaving page ---
    window.addEventListener("beforeunload", () => {
      localStorage.setItem(TIME_KEY, audio.currentTime.toString());
    });

    const muteBtn = document.getElementById("mute-btn");

    // Initialize icon based on current mute state
    function updateIcon() {
        muteBtn.textContent = audio.muted ? "🔇" : "🔊";
    }

    function toggleMute() {
        audio.muted = !audio.muted;
        localStorage.setItem(MUTE_KEY, audio.muted.toString());
        updateIcon();
    }

    // Allow BOTH click and touch
    muteBtn.addEventListener("click", toggleMute);
    muteBtn.addEventListener("touchstart", (e) => {
        e.preventDefault();   // avoid double-trigger on mobile
        toggleMute();
    });

    // update icon again when audio loads
    audio.addEventListener("loadeddata", updateIcon);

</script>

</html>
