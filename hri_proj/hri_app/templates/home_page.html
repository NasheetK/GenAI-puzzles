<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<div> PuzzlePuzzle </div>

<form action="{% url 'form_team_collaborative_single' %}">
    <button type="submit">Single Player</button>
</form>

<form action="{% url 'mode_selection' %}">
    <button type="submit">Two Players</button>
</form>

<form action="{% url 'form_team_collaborative_multi' %}">
    <button type="submit">More Players</button>
</form>

</body>

<script>
    window.addEventListener("DOMContentLoaded", () => {
        const message = "Please select the number of players.";
        const utterance = new SpeechSynthesisUtterance(message);
        utterance.lang = "en-US";
        utterance.rate = 0.8;
        utterance.pitch = 1;
        speechSynthesis.speak(utterance);
    });
</script>

</html>
